<!-- @dsCard group="Components" viewport="700x470" name="Cards" subtitle="Default, sunken, glass and hero surfaces; the DashCard every page is built from" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; }
  .lbl { margin: 0 0 8px; font: 600 10px/14px var(--font-sans); letter-spacing: 0.025em; text-transform: uppercase; color: var(--text-muted); }
  .stage { position: relative; overflow: hidden; margin-bottom: 18px; border-radius: 16px; padding: 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .grid4 > * { min-height: 72px; }
  .muted { color: var(--text-muted); }
  .on-accent { color: var(--bg); }
  .r { display: grid; grid-template-columns: 110px 110px 1fr; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .r:first-child { border-top: 0; padding-top: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Card, DashCard, FilterPills, Dropdown, StatusPill, BarcodeBar } = window.PeptideMiraclesDashboard_26e60f;
  const rows = [
    ["Profile 60", "ok", "Active", 82],
    ["Profile 59", "warn", "Throttled", 34],
    ["Profile 62", "orange", "Collapsing", 12],
  ];
  function Demo() {
    return (
      <>
        <div className="lbl">Surfaces</div>
        <div className="stage">
          <div className="grid4">
            <Card><span className="t-secondary muted">Default</span></Card>
            <Card sunken><span className="t-secondary muted">Sunken</span></Card>
            <Card glass><span className="t-secondary muted">Glass</span></Card>
            <Card hero><span className="t-secondary on-accent">Hero</span></Card>
          </div>
          <div className="glow-layer" style={{ height: "100%" }}>
            <span style={{ width: 220, height: 520, left: 250, top: -210, background: "var(--glow-a)" }} />
            <span style={{ width: 180, height: 460, right: -40, top: -170, background: "var(--glow-b)" }} />
          </div>
        </div>
        <div className="lbl">DashCard</div>
        <DashCard
          title="Accounts"
          toolbar={<FilterPills inline options={[{ value: "all", label: "All 29" }, { value: "healthy", label: "Healthy 22" }, { value: "attention", label: "Needs attention 7" }]} />}
          actions={<Dropdown label="Filters" badge={2}>{() => null}</Dropdown>}
          viewAllHref="#"
        >
          {rows.map(([name, tone, label, pct]) => (
            <div className="r" key={name}>
              <span className="t-body">{name}</span>
              <span><StatusPill tone={tone}>{label}</StatusPill></span>
              <BarcodeBar pct={pct} tone={tone} />
            </div>
          ))}
        </DashCard>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
