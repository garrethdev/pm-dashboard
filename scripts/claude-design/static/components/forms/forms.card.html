<!-- @dsCard group="Components" viewport="700x330" name="Forms" subtitle="Search field, filter dropdown with count badge, and the capped stepper" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; }
  .lbl { margin: 0 0 8px; font: 600 10px/14px var(--font-sans); letter-spacing: 0.025em; text-transform: uppercase; color: var(--text-muted); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .stack { display: grid; gap: 10px; margin-bottom: 20px; }
  .panel { display: grid; gap: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { SearchInput, Dropdown, Stepper, FilterPills } = window.PeptideMiraclesDashboard_26e60f;
  function Demo() {
    return (
      <div className="cols">
        <div>
          <div className="lbl">Search</div>
          <div className="stack">
            <SearchInput placeholder="Search accounts" />
            <SearchInput defaultValue="cleora" />
          </div>
          <div className="lbl">Dropdown</div>
          <Dropdown label="Filters" badge={2} defaultOpen>
            <div className="panel">
              <span className="t-overline">Platform</span>
              <FilterPills options={[{ value: "all", label: "All" }, { value: "tt", label: "TikTok" }, { value: "ig", label: "Instagram" }]} defaultValue="tt" />
            </div>
          </Dropdown>
        </div>
        <div>
          <div className="lbl">Stepper</div>
          <div className="stack">
            <Stepper label="Posts per day" hint="3 left" defaultValue={2} min={0} max={5} suffix="/day" />
            <Stepper label="Cleora ASMR" hint="At cap" defaultValue={3} min={0} max={3} />
            <Stepper label="Character 5" hint="Over by 1" hintTone="danger" defaultValue={0} min={0} max={4} />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
