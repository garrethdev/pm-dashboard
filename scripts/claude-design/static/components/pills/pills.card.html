<!-- @dsCard group="Components" viewport="700x330" name="Pills & filters" subtitle="Status pills as a severity ladder, the segmented switch, and the chips that echo active filters" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; }
  .lbl { width: 100%; margin: 0 0 -4px; font: 600 10px/14px var(--font-sans); letter-spacing: 0.025em; text-transform: uppercase; color: var(--text-muted); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
  .light { background: var(--bg); color: var(--text-primary); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { StatusPill, FilterPills, FilterChips } = window.PeptideMiraclesDashboard_26e60f;
  const ladder = [
    ["ok", "Active"], ["accent", "Ramping"], ["info", "Scheduled"], ["neutral", "Paused"],
    ["warn", "Throttled"], ["orange", "Collapsing"], ["danger", "Banned"], ["critical", "Shadowbanned"],
  ];
  const pills = () => ladder.map(([tone, label]) => <StatusPill key={tone} tone={tone}>{label}</StatusPill>);
  function Demo() {
    return (
      <>
        <div className="row"><span className="lbl">Status</span>{pills()}</div>
        <div className="row light" data-theme="light"><span className="lbl">Light</span>{pills()}</div>
        <div className="row">
          <span className="lbl">Segmented switch</span>
          <FilterPills inline options={[{ value: "all", label: "All" }, { value: "c1", label: "Char 1" }, { value: "c3", label: "Char 3", marked: true }, { value: "c5", label: "Char 5" }]} />
          <FilterPills inline defaultValue="c3" options={[{ value: "all", label: "All" }, { value: "c3", label: "Char 3", marked: true }]} />
        </div>
        <div className="row">
          <span className="lbl">Active filters</span>
          <FilterChips chips={[{ key: "platform", label: "TikTok" }, { key: "character", label: "Char 3" }, { key: "state", label: "Paused" }]} />
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
